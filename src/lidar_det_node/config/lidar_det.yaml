# lidar_det_node parameters (loaded into the node's private namespace).
#
# --- Point cloud input (single LiDAR vs 3-LiDAR fusion) ---
# Default below: /MainLidar/trans_points (see input_topic).
#
# Fusion stack (Main + BlindLidar + BlindLidar2 -> /fused_lidar/trans_points):
#   source devel/setup.bash
#   roslaunch lidar_det_node lidar_det_with_fusion.launch
#
# Rollback / A-B test (no code change):
#   roslaunch lidar_det_node lidar_det_with_fusion.launch fusion_enabled:=false
#     # fusion node runs but republishes main only
#   roslaunch lidar_det_node lidar_det_with_fusion.launch use_fused_input:=false
#     # detection subscribes /MainLidar/trans_points again
#   roslaunch lidar_det_node lidar_det_node.launch
#     # original: detection only, no fusion node
#
# Fusion-only node (tune lidar_cloud_fusion.yaml separately):
#   roslaunch lidar_det_node lidar_cloud_fusion.launch
#
backend: transfusion

# Model assets (relative to model_dir).
# model_dir empty => auto-detect: vendor/model -> share/lidar_det_node/model
#                                 -> 3d_target_detection/.../TransFusion/model
# File names empty => use the defaults below. Engines are per-platform/TRT-version.
#
# --- Switch model: comment one block, uncomment the other, and match class_map_profile ---
#
# nuScenes 10-class (open-source fast30):
scn_onnx:    "transfusion_fast30.scn.onnx"
bev_weights: "sparse_backbone_weights_fast30.bin"
bev_engine:  "transfusion_bev_fast30_h100.engine"
head_engine: "transfusion_head_fast30_fp16.engine"
class_map_profile: nuscenes_10

#x86 turn model
# Fine-tuned 3-class (0=CAR, 1=CYCLIST, 2=PEDESTRIAN):
# scn_onnx:    "transfusion.scn.onnx"
# bev_weights: "sparse_backbone_weights.bin"
# bev_engine:  "transfusion_bev.engine"
# head_engine: "transfusion_head_fp16.engine"
# class_map_profile: custom_3

feature_num: 5
verbose: false
lidar_height: 0.0

# Per output-label score gate (applied after collapse_to_output_labels).
# Omitted keys default to score_threshold above. Use stricter values to cut FP:
#   PEDESTRIAN score is typically highest; CAR lowest (see dump stats / scripts).
score_threshold: 0.15
score_threshold_pedestrian: 0.22
score_threshold_car: 0.15
score_threshold_cyclist: 0.20

# Intensity feature p[3]:
#   true  = 使用点云 intensity（UINT8 会显式读成 0~255）
#   false = 强制 p[3]=0（仿真/bag 或跨雷达时更稳，兼容老节点行为）
# 当前默认 false：本车 UINT8 bag 上 true 会导致车辆召回明显下降。
use_intensity: false

# Runtime diagnostics (ST_LOG -> log_file). Set debug_stats: false to silence
# periodic frame/summary logs while keeping ERR/WARN and first-cloud log.
debug_stats: true
stats_interval: 30       # P0/P1: log every N frames (pts/raw/kept/infer_ms)
summary_interval: 60     # P2: class-count summary every N frames
input_timeout_sec: 1.0   # P1: WARN if no cloud for this many seconds
health_topic: "/lidar_det/health"   # P3: Float32MultiArray; "" to disable

# ST_LOG output file. "" => stdout (captured by roslaunch / wrapper redirect).
# Leading "~" expands to $HOME. Separate from the navZero wrapper's stdout log
# (lidar_det_node.log) to avoid two writers on one file.
log_file: "~/map_config/log/debug/processprint/lidar_det_node_st.log"
# Log capacity (ST log file directory). 0 = unlimited for that constraint.
log_max_total_mb: 100        # max total size of lidar_det_node_st.log* in log dir
log_rotate_single_mb: 20     # rotate current log when it exceeds this size (MB)

# Save input point cloud to disk when abnormal frames are detected (for field debug).
save_abnormal_cloud: true
abnormal_cloud_dir: "~/map_config/log/debug/lidar_det_abnormal"
abnormal_cloud_max_total_mb: 512   # max total size of saved .pcd under abnormal_cloud_dir
abnormal_cloud_max_files: 500        # max number of .pcd files kept
abnormal_cloud_min_interval_sec: 2.0 # min seconds between saves of the same reason

# --- TransFusion per-frame detection dump (debug / algorithm comparison) ---
# Disabled by default: zero runtime cost when det_dump_enabled is false.
# TSV columns: frame, stamp, class, score, box pose/size, filter_reason, published.
det_dump_enabled: false
# Empty => auto file under det_dump_dir with timestamp, e.g. lidar_det_dump_20260706_164100.tsv
det_dump_file: ""
det_dump_dir: "~/map_config/log/debug/lidar_det_dump"
det_dump_flush_every: 30      # fflush every N frames (bag playback safety)
det_dump_max_total_mb: 512    # prune old lidar_det_dump_*.tsv in det_dump_dir
det_dump_max_files: 50
# Compare two dump files: scripts/compare_det_dump.py (see --help)

# ROS I/O (kept compatible with the original pcpt_net_node contract).
# Default: single MainLidar. For 3-LiDAR fusion use launch/lidar_det_with_fusion.launch
# or set input_topic to /fused_lidar/trans_points after starting lidar_cloud_fusion.
input_topic:  "/MainLidar/trans_points"
# input_topic:  "/fused_lidar/trans_points"
output_topic: "/box_msgs"
marker_topic: "/detect_box_markers"
# RViz: add MarkerArray on marker_topic to see class + score + velocity on each box.
marker_show_text: true          # e.g. "PED 0.35 v=1.20m/s (0.8,-0.9) [pedestrian]"
marker_show_velocity: true      # show |v| and (vx,vy) in label text
marker_show_velocity_arrow: true # ARROW marker along velocity direction (base_link)
marker_velocity_min_mps: 0.1     # hide arrow when speed below this (m/s)
# Arrow length (m) = max(min_length, speed * scale). Example: 1 m/s -> 3 m arrow.
marker_velocity_arrow_scale: 6.0
marker_velocity_arrow_min_length: 3   # minimum visible length even at low speed
marker_velocity_arrow_shaft: 0.02       # shaft diameter (m); smaller = thinner
marker_velocity_arrow_head: 0.05        # head diameter (m); smaller = sharper tip
marker_color_by_class: true      # green=PED blue=CAR yellow=CYC; low score = more transparent
marker_text_scale: 0.45         # text height in RViz
marker_text_z_offset: 0.6       # meters above box top
frame_id:     ""          # empty => reuse incoming cloud header.frame_id

# nuScenes class id (string key) -> comm_msg/label.msg value. Overrides the
# built-in default map; only listed ids are changed.
# class_map:
#   "0": 4    # car        -> CAR
#   "7": 3    # bicycle    -> BICYCLE
#   "8": 1    # pedestrian -> PEDESTRIAN
# class_map_profile: nuscenes_10 | custom_3
#   nuscenes_10 - native 0..9 (nuScenes names)
#   custom_3    - native 0=CAR, 1=CYCLIST, 2=PEDESTRIAN
#
# filter_unmapped_labels: drop native ids not in the profile map (no UNKNOWN).
# collapse_to_output_labels: publish only CAR(4) / CYCLIST(2) / PEDESTRIAN(1):
#   TRUCK,BUS,TRAM -> CAR;  BICYCLE,TRICYCLE -> CYCLIST;  barrier/cone/etc. dropped.
filter_unmapped_labels: true
collapse_to_output_labels: true

# class_map:
#   "0": 4    # car        -> CAR
#   "1": 2    # bicycle    -> BICYCLE
#   "2": 1    # pedestrian -> PEDESTRIAN

# Optional per-native-id overrides on top of class_map_profile.
# class_map:
#   "7": 3
