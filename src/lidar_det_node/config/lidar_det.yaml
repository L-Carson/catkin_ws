# lidar_det_node parameters (loaded into the node's private namespace).
backend: transfusion

# Model assets (relative to model_dir).
# model_dir empty => auto-detect: vendor/model -> share/lidar_det_node/model
#                                 -> 3d_target_detection/.../TransFusion/model
# File names empty => use the defaults below. Engines are per-platform/TRT-version.
#
# --- Switch model: comment one block, uncomment the other, and match class_map_profile ---
#
# nuScenes 10-class (open-source fast30):
scn_onnx:    "transfusion_fast30.scn.onnx"
bev_weights: "sparse_backbone_weights_fast30.bin"
bev_engine:  "transfusion_bev_fast30_h100.engine"
head_engine: "transfusion_head_fast30_fp16.engine"
class_map_profile: nuscenes_10

#x86 turn model
# Fine-tuned 3-class (0=CAR, 1=CYCLIST, 2=PEDESTRIAN):
# scn_onnx:    "transfusion.scn.onnx"
# bev_weights: "sparse_backbone_weights.bin"
# bev_engine:  "transfusion_bev.engine"
# head_engine: "transfusion_head_fp16.engine"
# class_map_profile: custom_3

feature_num: 5
verbose: false
lidar_height: 1.68
score_threshold: 0.2

# Runtime diagnostics (ST_LOG -> log_file). Set debug_stats: false to silence
# periodic frame/summary logs while keeping ERR/WARN and first-cloud log.
debug_stats: true
stats_interval: 30       # P0/P1: log every N frames (pts/raw/kept/infer_ms)
summary_interval: 60     # P2: class-count summary every N frames
input_timeout_sec: 1.0   # P1: WARN if no cloud for this many seconds
health_topic: "/lidar_det/health"   # P3: Float32MultiArray; "" to disable

# ST_LOG output file. "" => stdout (captured by roslaunch / wrapper redirect).
# Leading "~" expands to $HOME. Separate from the navZero wrapper's stdout log
# (lidar_det_node.log) to avoid two writers on one file.
log_file: "~/map_config/log/debug/processprint/lidar_det_node_st.log"
# Log capacity (ST log file directory). 0 = unlimited for that constraint.
log_max_total_mb: 100        # max total size of lidar_det_node_st.log* in log dir
log_rotate_single_mb: 20     # rotate current log when it exceeds this size (MB)

# Save input point cloud to disk when abnormal frames are detected (for field debug).
save_abnormal_cloud: true
abnormal_cloud_dir: "~/map_config/log/debug/lidar_det_abnormal"
abnormal_cloud_max_total_mb: 512   # max total size of saved .pcd under abnormal_cloud_dir
abnormal_cloud_max_files: 500        # max number of .pcd files kept
abnormal_cloud_min_interval_sec: 2.0 # min seconds between saves of the same reason

# ROS I/O (kept compatible with the original pcpt_net_node contract).
input_topic:  "/MainLidar/trans_points"
output_topic: "/box_msgs"
marker_topic: "/detect_box_markers"
frame_id:     ""          # empty => reuse incoming cloud header.frame_id

# nuScenes class id (string key) -> comm_msg/label.msg value. Overrides the
# built-in default map; only listed ids are changed.
# class_map:
#   "0": 4    # car        -> CAR
#   "7": 3    # bicycle    -> BICYCLE
#   "8": 1    # pedestrian -> PEDESTRIAN
# class_map_profile: nuscenes_10 | custom_3
#   nuscenes_10 - native 0..9 (nuScenes names)
#   custom_3    - native 0=CAR, 1=CYCLIST, 2=PEDESTRIAN
#
# filter_unmapped_labels: drop native ids not in the profile map (no UNKNOWN).
# collapse_to_output_labels: publish only CAR(4) / CYCLIST(2) / PEDESTRIAN(1):
#   TRUCK,BUS,TRAM -> CAR;  BICYCLE,TRICYCLE -> CYCLIST;  barrier/cone/etc. dropped.
filter_unmapped_labels: true
collapse_to_output_labels: true

# class_map:
#   "0": 4    # car        -> CAR
#   "1": 2    # bicycle    -> BICYCLE
#   "2": 1    # pedestrian -> PEDESTRIAN

# Optional per-native-id overrides on top of class_map_profile.
# class_map:
#   "7": 3
